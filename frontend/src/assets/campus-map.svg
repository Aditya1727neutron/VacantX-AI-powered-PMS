  <circle cx="5" cy="160" r="4" stroke-width="1.5"/>
  <circle cx="240" cy="5" r="4" stroke-width="1.5"/>
  <circle cx="240" cy="315" r="4" stroke-width="1.5"/>

  <!-- Paths/walkways -->
  <path d="M90 60 Q120 80 120 100" stroke-dasharray="2 3"/>
  <path d="M175 60 Q180 80 185 100" stroke-dasharray="2 3"/>
  <path d="M310 60 Q320 80 320 105" stroke-dasharray="2 3"/>
  <path d="M90 225 Q90 240 85 255" stroke-dasharray="2 3"/>
