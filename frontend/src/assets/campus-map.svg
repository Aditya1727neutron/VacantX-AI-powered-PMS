<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.15">
  <!-- Roads -->
  <line x1="0" y1="160" x2="480" y2="160" stroke-dasharray="8 4"/>
  <line x1="240" y1="0" x2="240" y2="320" stroke-dasharray="8 4"/>
  <line x1="120" y1="0" x2="120" y2="320" stroke-dasharray="4 8"/>
  <line x1="360" y1="0" x2="360" y2="320" stroke-dasharray="4 8"/>
  <line x1="0" y1="80" x2="480" y2="80" stroke-dasharray="4 8"/>
  <line x1="0" y1="240" x2="480" y2="240" stroke-dasharray="4 8"/>

  <!-- Building blocks -->
  <rect x="30" y="20" width="60" height="40" rx="3" stroke-width="1"/>
  <rect x="150" y="30" width="50" height="30" rx="3" stroke-width="1"/>
  <rect x="280" y="15" width="55" height="45" rx="3" stroke-width="1"/>
  <rect x="390" y="25" width="65" height="35" rx="3" stroke-width="1"/>

