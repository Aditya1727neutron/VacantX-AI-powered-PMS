  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
    <rect x="54" y="0" width="14" height="22" rx="1.5"/>
    <rect x="72" y="0" width="14" height="22" rx="1.5"/>
  </g>
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
    <rect x="54" y="0" width="14" height="22" rx="1.5"/>
  </g>
  <g transform="translate(310, 105)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
    <rect x="54" y="0" width="14" height="22" rx="1.5"/>
    <rect x="72" y="0" width="14" height="22" rx="1.5"/>
    <rect x="90" y="0" width="14" height="22" rx="1.5"/>
  </g>

  <g transform="translate(60, 255)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
    <rect x="54" y="0" width="14" height="22" rx="1.5"/>
  </g>
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
  </g>
  <g transform="translate(330, 260)">
    <rect x="0" y="0" width="14" height="22" rx="1.5"/>
    <rect x="18" y="0" width="14" height="22" rx="1.5"/>
    <rect x="36" y="0" width="14" height="22" rx="1.5"/>
    <rect x="54" y="0" width="14" height="22" rx="1.5"/>
